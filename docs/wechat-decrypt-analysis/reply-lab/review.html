<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>本人回复 · 样本筛选</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#263128;font:16px/1.65 system-ui,sans-serif}main{max-width:880px;margin:auto;padding:36px 24px}h1{font-size:30px;margin:0}p{margin:8px 0 20px}.bar{position:sticky;top:0;background:#f5f3ed;padding:16px 0;border-bottom:1px solid #ccd1c8;z-index:1;display:flex;gap:16px;align-items:center;flex-wrap:wrap}button{border:0;border-radius:5px;background:#285b42;color:white;padding:12px 18px;font:inherit;cursor:pointer}article{background:#fff;border:1px solid #d8ddd5;border-radius:8px;padding:24px;margin-top:24px}h2{font-size:17px;margin:0 0 12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;background:#f3f6f1;padding:16px;border-radius:4px}label{display:block;margin-top:12px}input,select,textarea{font:inherit}textarea,select{width:100%;border:1px solid #8c9d90;border-radius:4px;padding:9px;background:white}textarea{min-height:70px}small{color:#59675c}summary{cursor:pointer}button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #b36d26;outline-offset:3px}.note{border-left:3px solid #b36d26;padding-left:14px}
</style>
<main><h1>让回复更像你</h1><p>先挑选有效对话，再用未见过的样本验证效果。</p>
<p class="note">仅在本地处理，无网络调用。资料是历史快照，机械遮罩仍需人工复核。刷新或关闭前请导出；本页不会自动保存。</p>
<div class="bar"><button id="export">导出已编辑样本</button><label style="margin:0">恢复已导出文件 <input id="restore" type="file" accept=".json"></label><span id="count" role="status"></span></div>
<div id="samples"></div></main>
<script>
let samples=/*SAMPLES*/[];
const labelOptions={scene:['工作','闲聊','生活事务','情绪交流','混合场景','待判断'],reply_state:['正常回应','暂时没空','不确定','催促推进','表达不满','轻松玩笑','待判断']};
const sceneFilter=document.createElement('select');sceneFilter.setAttribute('aria-label','按聊天场景筛选');['全部场景',...labelOptions.scene].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;sceneFilter.append(o);});document.querySelector('.bar').append(sceneFilter);sceneFilter.onchange=render;
const root=document.getElementById('samples');
function update(){document.getElementById('count').textContent=`已选择 ${samples.filter(s=>s.approved).length} / ${samples.length} 段`;}
function render(){root.replaceChildren();samples.forEach((s,index)=>{
 if(sceneFilter.value!=='全部场景'&&s.scene!==sceneFilter.value)return;
 const card=document.createElement('article');
 const heading=document.createElement('h2');heading.textContent=`${index+1}. 会话 ${s.chat_id.slice(0,6)} · ${s.date}`;card.append(heading);
 const context=document.createElement('pre');context.textContent=s.context.map(m=>`${m.role}：${m.text}`).join('\n');card.append(context);
 const details=document.createElement('details'),summary=document.createElement('summary'),answer=document.createElement('pre');summary.textContent='查看你当时的回复（采样复核用）';answer.textContent=s.reference.join('\n');details.append(summary,answer);card.append(details);
 const kindLabel=document.createElement('label');kindLabel.textContent='聊天对象类型';const select=document.createElement('select');['待确认','同事','领导','家人','群聊'].forEach(v=>{const o=document.createElement('option');o.textContent=v;o.value=v;select.append(o);});select.value=s.object_type;select.onchange=()=>s.object_type=select.value;kindLabel.append(select);card.append(kindLabel);
 for(const [key,title] of [['scene','聊天场景'],['reply_state','本人当时的回应状态']]){const label=document.createElement('label');label.textContent=title;const control=document.createElement('select');for(const v of labelOptions[key]){const o=document.createElement('option');o.value=v;o.textContent=v;control.append(o);}control.value=s[key]||'待判断';control.onchange=()=>{s[key]=control.value;s.label_source='用户调整';};label.append(control);card.append(label);}
 const note=document.createElement('small');note.textContent=`${s.label_source||'待判断'}。场景依据：${JSON.stringify(s.label_evidence?.scene||{})}；状态依据（仅此前本人发言）：${JSON.stringify(s.label_evidence?.reply_state||{})}`;card.append(note);
 [['intent','你想表达的意思（不用模仿措辞）'],['facts','这次回复可以使用的事实和承诺，没有则写“无”']].forEach(([key,title])=>{const label=document.createElement('label');label.textContent=title;const input=document.createElement('textarea');input.value=s[key]||'';input.oninput=()=>s[key]=input.value;label.append(input);card.append(label);});
 [['privacy_reviewed','已人工检查，内容适合后续试验'],['approved','选入样本集']].forEach(([key,title])=>{const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=!!s[key];check.onchange=()=>{s[key]=check.checked;update();};label.append(check,document.createTextNode(' '+title));card.append(label);});
 root.append(card);
});update();}
document.getElementById('export').onclick=()=>{const invalid=samples.filter(s=>s.approved&&(!s.privacy_reviewed||s.object_type==='待确认'||!s.intent.trim()));if(invalid.length){alert(`有 ${invalid.length} 段已选样本缺少类型、表达意图或隐私复核，请补齐。`);return;}const blob=new Blob([JSON.stringify(samples,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='reviewed-candidates.private.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
document.getElementById('restore').onchange=async event=>{try{const file=event.target.files[0];if(!file)return;const restored=JSON.parse(await file.text());if(!Array.isArray(restored)||restored.length!==samples.length||restored.some((s,i)=>s.id!==samples[i].id))throw Error('文件不属于这一批样本');for(let i=0;i<samples.length;i++){for(const key of ['object_type','intent','facts','approved','privacy_reviewed']){if(typeof restored[i][key]!==typeof samples[i][key])throw Error('字段格式不正确');}for(const key of ['scene','reply_state']){if(key in restored[i]&&!labelOptions[key].includes(restored[i][key]))throw Error('场景状态格式不正确');}}samples.forEach((s,i)=>{for(const key of ['object_type','intent','facts','approved','privacy_reviewed'])s[key]=restored[i][key];for(const key of ['scene','reply_state'])if(key in restored[i]){s[key]=restored[i][key];s.label_source='从用户导出文件恢复';}});render();}catch(error){alert('恢复失败：'+error.message);}};
render();
</script></html>
