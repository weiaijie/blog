<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日研究入口</title><link rel="stylesheet" href="style.css"><main><h1>每日研究入口</h1><p>只有完整核验的报告才能成为当前检查点。</p><section id="state" aria-live="polite">正在读取账户状态……</section><section><h2>采集与核验运行状态</h2><div id="operation" aria-live="polite">正在读取运行记录……</div><p>状态来自最近一次运行记录，请同时核对时间。定时器启动后30秒补检查；交易日16:10、16:40、17:10运行。当天已核验后重复执行不采集、不新增收益。</p></section><p><a href="../config/active_run.json">账户状态索引</a> · <a href="operation_status.json">运行状态原始记录</a> · <a href="index.html">独立历史研究</a> · <a href="../docs/DAILY_PIPELINE.md">运行与恢复说明</a></p><p>仅研究模拟，无实盘与外部消息。离线直接打开文件时，浏览器可能阻止读取JSON，请使用本地HTTP服务或状态索引中的报告路径。</p></main><script>
fetch('../config/active_run.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('状态请求失败');return r.json()}).then(x=>{if(!/^reports\/daily\/[A-Za-z0-9-]+\/site\/index\.html$/.test(x.dashboard))throw Error('状态路径无效');const box=document.getElementById('state');box.textContent='当前已核验至 '+x.as_of+'。 ';const a=document.createElement('a');a.textContent='打开完整日报';a.href='../'+x.dashboard;box.append(a)}).catch(e=>document.getElementById('state').textContent='未能读取账户状态：'+e.message);
fetch('operation_status.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('尚无运行记录');return r.json()}).then(x=>{const box=document.getElementById('operation');box.textContent='';const labels={success:'最近运行成功',failed:'最近运行失败，需检查证据',running:'运行中，结果尚未确认'};const p=document.createElement('p');p.textContent=(labels[x.phase]||'未知状态')+' · '+(x.mode==='validation_refresh'?'工程验收刷新':'日常检查');box.append(p);if(x.phase==='running'&&Date.now()-Date.parse(x.started_at_utc)>15*60*1000){const w=document.createElement('p');w.textContent='运行记录超过15分钟仍未完成，请检查中断或超时。';box.append(w)}const t=document.createElement('p');t.textContent='北京时间：'+new Date(x.finished_at_utc||x.started_at_utc).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'});box.append(t);const s=document.createElement('p');s.textContent='记录时定时器：'+((x.scheduler||{}).timer_enabled||'未知')+'；活动状态：'+((x.scheduler||{}).timer_active||'未知')+'；退出登录保持运行：'+((x.scheduler||{}).linger||'未知');box.append(s);if(x.result&&x.result.status==='up_to_date'){const n=document.createElement('p');n.textContent='账户已是最新，本次零网络请求、零账户变化。';box.append(n)}if(/^reports\/operations\/[A-Za-z0-9-]+$/.test(x.operation)){const a=document.createElement('a');a.href='../'+x.operation+(x.phase==='running'?'/started.json':'/result.json');a.textContent='查看本次运行证据';box.append(a);if(x.phase==='failed'){const log=document.createElement('a');log.href='../'+x.operation+'/stderr.log';log.textContent=' 查看错误日志';box.append(log)}}}).catch(e=>document.getElementById('operation').textContent='运行状态未知：'+e.message);
</script></html>
