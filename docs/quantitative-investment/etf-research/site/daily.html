<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日研究入口</title><link rel="stylesheet" href="style.css"><main><h1>每日研究入口</h1><p>读取单一状态索引，进入已完整核验的报告。失败或未完成的运行不切换入口。</p><section id="state" aria-live="polite">正在读取状态……</section><p><a href="../config/active_run.json">查看状态索引</a> · <a href="index.html">历史研究与固定检查点</a></p><p>尚未启用持续定时任务；无实盘或外部提醒。离线直接打开文件时，浏览器可能阻止读取JSON，请使用本地HTTP服务或状态索引中的报告路径。</p></main><script>
fetch('../config/active_run.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('状态请求失败');return r.json()}).then(x=>{if(!/^reports\/daily\/[A-Za-z0-9-]+\/site\/index\.html$/.test(x.dashboard)&&x.dashboard!=='site/index.html')throw Error('状态路径无效');const box=document.getElementById('state');box.textContent='当前已核验至 '+x.as_of+'。 ';const a=document.createElement('a');a.textContent='打开完整日报';a.href='../'+x.dashboard;box.append(a)}).catch(e=>document.getElementById('state').textContent='未能读取状态，请查看状态索引。'+e.message);
</script></html>
